# Pipeline harian otonom. GERBANG KERAS TIM: hidup paling lambat Senin 14 Sep.
#
# Jam bukti "not faked for the demo" mulai berdetak di sini. Kita butuh >=10 hari
# bursa artefak runs/ yang di-commit tanpa disentuh manusia, dan itu tidak bisa
# dikejar belakangan — 10 hari bursa butuh 10 hari bursa. [T5]
#
# TAHAP 1 : sapuan Tier-1 + watchlist -> commit runs/YYYY-MM-DD/
# TAHAP 2 : agen menyelidiki top-N kandidat -> commit runs/investigations/
#           Aktif kalau secret MINIMAX_API_KEY ada; kalau tidak, dilewati (bukan
#           gagal) supaya Tahap 1 tetap menyumbang bukti otonom tiap hari.
# EKSPOR  : runs/ -> web/public/data/, supaya web ikut hidup tanpa sentuhan.

name: Pipeline harian

on:
  schedule:
    # 10:30 UTC = 17:30 WIB, Senin–Jumat. Bursa tutup 16:00 WIB, jadi ini
    # sesudah data EOD tersedia dan sebelum tengah malam WIB.
    # Catatan: cron GitHub tidak menjamin ketepatan menit dan bisa telat
    # sampai belasan menit saat runner ramai. Tidak masalah — data EOD tidak
    # berubah, dan tanggal artefaknya tetap benar.
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Tanggal acuan (YYYY-MM-DD). Kosong = hari ini UTC."
        required: false
        type: string
      investigate:
        description: "Jalankan Tahap 2 (agen menyelidiki top-N). Butuh MINIMAX_API_KEY."
        required: false
        type: boolean
        default: true
      top_n:
        description: "Berapa kandidat teratas diselidiki Tahap 2."
        required: false
        type: string
        default: "3"

permissions:
  contents: write

# Dua jalannya sekaligus akan saling menimpa commit warehouse.
concurrency:
  group: pipeline-harian
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Butuh riwayat untuk rebase sebelum push — commit otomatis tidak
          # boleh menimpa kerja orang. [QA M4]
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: make setup

      # Gagal keras dan terlihat. Secret yang hilang tanpa pesan akan tampak
      # seperti "sapuan kosong" berhari-hari sebelum ada yang sadar.
      - name: Pastikan API key ada
        env:
          SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
        run: |
          if [ -z "$SECTORS_API_KEY" ]; then
            echo "::error::secret SECTORS_API_KEY tidak ada. Setel di Settings > Secrets > Actions."
            exit 1
          fi

      - name: Tentukan tanggal acuan
        id: tanggal
        run: |
          AS_OF="${{ inputs.as_of }}"
          [ -z "$AS_OF" ] && AS_OF="$(date -u +%F)"
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
          echo "Tanggal acuan: $AS_OF"

      - name: Posisi kredit sebelum
        run: make credits

      - name: Sapuan Tier-1
        env:
          SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
        run: |
          python -m core.ingest.tier1_market \
            --as-of "${{ steps.tanggal.outputs.as_of }}" \
            --run-dir "runs/${{ steps.tanggal.outputs.as_of }}"

      # ── TAHAP 2 — agen menyelidiki top-N kandidat ──────────────────────────
      # Dilewati (bukan gagal) kalau MINIMAX_API_KEY tidak ada: Tahap 1 sudah
      # menyumbang artefak, dan cron tidak boleh merah cuma karena LLM belum
      # disetel. Anggaran ganda: pagu fase `daily` di CreditAwareClient + top-N
      # kecil. LLM MiniMax terpisah dari kredit Sectors [K9].
      - name: Tahap 2 — investigasi agen
        env:
          SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          PANTAU_LLM_PROVIDER: minimax
        run: |
          if [ "${{ inputs.investigate }}" = "false" ]; then
            echo "Tahap 2 dilewati (input investigate=false)"; exit 0
          fi
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "::warning::MINIMAX_API_KEY tidak ada — Tahap 2 dilewati. Setel secret untuk mengaktifkan investigasi otonom."
            exit 0
          fi
          python tools/investigate_watchlist.py \
            --as-of "${{ steps.tanggal.outputs.as_of }}" \
            --top "${{ inputs.top_n || '3' }}"

      # Web membaca web/public/data/, bukan runs/. Tanpa langkah ini index.json
      # beku sejak 11 Sep walau cron sukses tiap hari. [AUDIT B5]
      # Gagal ekspor TIDAK boleh menjatuhkan commit hari itu: sapuan dan
      # investigasi tetap bukti yang sah walau web tertinggal satu malam.
      # to_json sendiri menolak transkrip yang tidak lolos kontrak.
      - name: Ekspor data web
        run: |
          python -m core.export.to_json \
            || echo "::warning::ekspor web gagal sebagian — web/public/data mungkin tertinggal"

      - name: Posisi kredit sesudah
        run: make credits

      # Menyaring artefak SESUDAH Tahap 2 dan ekspor web, supaya narasi LLM
      # tersimpan ikut diperiksa di kedua tempat — kalimat terlarang tidak boleh
      # sempat ter-commit. [K5]
      - name: Larangan kosakata atas artefak baru
        run: make vocab

      - name: Commit artefak
        run: |
          git config user.name "pantau-bot"
          git config user.email "pantau-bot@users.noreply.github.com"

          # data/llm_ledger.jsonl WAJIB ikut: Tahap 2 menulisnya tiap kali agen
          # memanggil LLM. Kalau tidak di-add, ia tertinggal unstaged dan
          # memblokir `pull --rebase` di bawah — persis yang menjatuhkan cron
          # 21 Sep (seluruh commit hilang, investigasi ikut hangus).
          git add runs/ data/warehouse/ web/public/data/ \
                  data/credit_ledger.jsonl data/llm_ledger.jsonl data/memory.duckdb
          if git diff --cached --quiet; then
            echo "tidak ada perubahan untuk di-commit"
            exit 0
          fi

          # Sebut investigasi di pesan commit kalau ada transkrip baru hari ini —
          # supaya riwayat commit membedakan hari yang cuma sapuan dari hari yang
          # benar-benar menyelidiki.
          N=$(git diff --cached --name-only \
              | grep -c "runs/investigations/.*${{ steps.tanggal.outputs.as_of }}" || true)
          if [ "$N" -gt 0 ]; then
            MSG="chore(runs): sapuan Tier-1 + ${N} investigasi ${{ steps.tanggal.outputs.as_of }} [otomatis]"
          else
            MSG="chore(runs): sapuan Tier-1 ${{ steps.tanggal.outputs.as_of }} [otomatis]"
          fi
          git commit -m "$MSG"

          # Rebase dulu: lajur lain merge ke main tiap hari, dan commit otomatis
          # tidak boleh menimpa kerja mereka. --autostash: kalau toh ada berkas
          # terlacak yang tersentuh tapi belum di-add, ia disimpan sementara dan
          # dikembalikan setelah rebase — jaring pengaman kedua supaya satu
          # berkas terlewat tidak pernah lagi menjatuhkan seluruh push.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "percobaan push $attempt gagal, coba lagi"
            sleep $((attempt * 5))
          done
          echo "::error::gagal push artefak setelah 3 percobaan"
          exit 1

      # Bukti untuk juri: artefak bisa diunduh dari halaman run, ber-timestamp,
      # walau commit-nya gagal karena alasan lain.
      #
      # Transkrip investigasi hari itu WAJIB ikut. Commit 21 dan 23 Sep gagal,
      # dan karena dulu cuma runs/<tanggal>/ yang diunggah, sapuannya bisa
      # dipulihkan tapi investigasinya hilang tanpa jejak — harus dibayar ulang
      # dengan kredit, dan hasilnya bukan lagi yang dibuat cron. [PR #16]
      #
      # Dua path → akar artefak jadi runs/, jadi pulihkan dengan unzip ke runs/.
      # Isinya mentah, belum tentu lolos gerbang kosakata (23 Sep justru gagal di
      # sana) — memulihkan dari sini tetap lewat `make vocab` sebelum commit. [K5]
      - name: Unggah artefak run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ steps.tanggal.outputs.as_of }}
          path: |
            runs/${{ steps.tanggal.outputs.as_of }}/
            runs/investigations/*-${{ steps.tanggal.outputs.as_of }}.json
          if-no-files-found: warn
          retention-days: 30
